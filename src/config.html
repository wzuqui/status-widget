<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurar</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        background: #0f1115; color: #f4f7ff;
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 13px;
      }
      body { padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; }

      h2 { font-size: 14px; color: #8f9bb7; border-bottom: 1px solid #2a3144; padding-bottom: 6px; }

      .field { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
      label { font-size: 12px; color: #7fd1ff; font-weight: 600; }
      input[type="text"] {
        width: 100%; padding: 6px 8px;
        background: #151a28; border: 1px solid #2a3144; border-radius: 6px;
        color: #f4f7ff; font-size: 13px; font-family: "Cascadia Code", "Consolas", monospace;
        outline: none;
      }
      input[type="text"]:focus { border-color: #7fd1ff; }

      .file-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
      .file-path {
        flex: 1; padding: 6px 8px;
        background: #151a28; border: 1px solid #2a3144; border-radius: 6px;
        color: #8f9bb7; font-size: 12px; font-family: "Cascadia Code", "Consolas", monospace;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        min-height: 30px; line-height: 18px;
      }
      .file-path.has-value { color: #f4f7ff; }

      button {
        padding: 6px 14px; border: 1px solid #2a3144; border-radius: 6px;
        background: #151a28; color: #f4f7ff; font-size: 12px; cursor: pointer;
        white-space: nowrap;
      }
      button:hover { background: #1d2233; border-color: #7fd1ff; }

      .actions {
        margin-top: auto; display: flex; justify-content: flex-end; gap: 8px;
        padding-top: 12px; border-top: 1px solid #2a3144;
      }
      .btn-save { background: #1a3a5c; border-color: #7fd1ff; color: #7fd1ff; font-weight: 600; }
      .btn-save:hover { background: #254a6e; }
    </style>
  </head>
  <body>
    <section>
      <h2>Claude</h2>
      <div class="field">
        <label for="orgId">Organization ID</label>
        <input type="text" id="orgId" placeholder="ex: 13e27f74-9e57-..." />
      </div>
      <div class="field">
        <label for="cookie">Cookie</label>
        <input type="text" id="cookie" placeholder="sessionKey=sk-ant-..." />
      </div>
    </section>

    <section>
      <h2>Codex (OpenAI)</h2>
      <label>Arquivo auth.json</label>
      <div class="file-row">
        <div class="file-path" id="filePath">nenhum arquivo selecionado</div>
        <button type="button" id="btnSelect">Selecionar...</button>
      </div>
    </section>

    <div class="actions">
      <button type="button" id="btnCancel">Cancelar</button>
      <button type="button" id="btnSave" class="btn-save">Salvar</button>
    </div>

    <script>
      const $ = (sel) => document.querySelector(sel);
      const orgId = $('#orgId');
      const cookie = $('#cookie');
      const filePath = $('#filePath');
      const btnSelect = $('#btnSelect');
      const btnSave = $('#btnSave');
      const btnCancel = $('#btnCancel');

      let openaiJsonPath = '';

      window.configApi.getConfig().then((cfg) => {
        orgId.value = cfg.CLAUDE_ORGANIZATION_ID || '';
        cookie.value = cfg.CLAUDE_COOKIE || '';
        openaiJsonPath = cfg.OPENAI_JSON_PATH || '';
        if (openaiJsonPath) {
          filePath.textContent = openaiJsonPath;
          filePath.classList.add('has-value');
        }
      });

      btnSelect.addEventListener('click', async () => {
        const result = await window.configApi.selectFile();
        if (result) {
          openaiJsonPath = result;
          filePath.textContent = result;
          filePath.classList.add('has-value');
        }
      });

      btnSave.addEventListener('click', async () => {
        await window.configApi.save({
          CLAUDE_ORGANIZATION_ID: orgId.value.trim(),
          CLAUDE_COOKIE: cookie.value.trim(),
          OPENAI_JSON_PATH: openaiJsonPath.trim(),
        });
      });

      btnCancel.addEventListener('click', () => {
        window.configApi.cancel();
      });
    </script>
  </body>
</html>
